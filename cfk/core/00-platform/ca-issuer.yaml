# Private CA for the demo: a self-signed root, used only to sign the CA issuer below.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-bootstrap
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wf-demo-root-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: WF Demo Root CA
  subject:
    organizations: [WF Demo]
    organizationalUnits: [Platform Security]
  secretName: wf-demo-root-ca
  duration: 87600h
  privateKey:
    algorithm: RSA
    size: 4096
  issuerRef:
    kind: ClusterIssuer
    name: selfsigned-bootstrap
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: wf-demo-ca
spec:
  ca:
    secretName: wf-demo-root-ca
