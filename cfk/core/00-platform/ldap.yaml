# OpenLDAP for MDS (users and groups), LDAPS on 636 with the cert-manager certificate ldap-sslcerts.
# Secrets ldap-env and ldap-ldifs are generated by deploy.sh from cfk/.secrets/passwords.env.
apiVersion: v1
kind: Service
metadata:
  name: ldap
  namespace: confluent
spec:
  clusterIP: None
  selector:
    app: ldap
  ports:
    - { name: ldap, port: 389 }
    - { name: ldaps, port: 636 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ldap
  namespace: confluent
spec:
  serviceName: ldap
  replicas: 1
  selector:
    matchLabels:
      app: ldap
  template:
    metadata:
      labels:
        app: ldap
    spec:
      containers:
        - name: ldap
          image: osixia/openldap:1.5.0
          args: [--copy-service, --loglevel=info]
          ports:
            - { name: ldap, containerPort: 389 }
            - { name: ldaps, containerPort: 636 }
          env:
            - { name: LDAP_ORGANISATION, value: WF Demo }
            - { name: LDAP_DOMAIN, value: wf.demo }
            - { name: LDAP_BASE_DN, value: "dc=wf,dc=demo" }
            - { name: LDAP_READONLY_USER, value: "true" }
            - { name: LDAP_READONLY_USER_USERNAME, value: mds }
            - { name: LDAP_TLS, value: "true" }
            - { name: LDAP_TLS_CRT_FILENAME, value: tls.crt }
            - { name: LDAP_TLS_KEY_FILENAME, value: tls.key }
            - { name: LDAP_TLS_CA_CRT_FILENAME, value: ca.crt }
            - { name: LDAP_TLS_VERIFY_CLIENT, value: never }
          envFrom:
            - secretRef:
                name: ldap-env
          readinessProbe:
            tcpSocket: { port: 636 }
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: certs, mountPath: /container/service/slapd/assets/certs }
            - { name: ldifs, mountPath: /container/service/slapd/assets/config/bootstrap/ldif/custom }
            - { name: ldap-data, mountPath: /var/lib/ldap }
            - { name: ldap-config, mountPath: /etc/ldap/slapd.d }
      volumes:
        - name: certs
          secret:
            secretName: ldap-sslcerts
        - name: ldifs
          secret:
            secretName: ldap-ldifs
  volumeClaimTemplates:
    - metadata:
        name: ldap-data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
    - metadata:
        name: ldap-config
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
