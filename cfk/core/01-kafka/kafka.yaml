apiVersion: platform.confluent.io/v1beta1
kind: KRaftController
metadata:
  name: kraftcontroller
  namespace: confluent
spec:
  replicas: 3
  oneReplicaPerNode: true
  image:
    application: confluentinc/cp-server:8.4.1
    init: confluentinc/confluent-init-container:3.4.0
  dataVolumeCapacity: 20Gi
  tls:
    secretRef: tls-kraftcontroller
  listeners:
    controller:
      authentication:
        type: mtls
        principalMappingRules:
          - "RULE:.*CN=([a-zA-Z0-9.-]*).*$/$1/"
          - "DEFAULT"
      tls:
        enabled: true
  authorization:
    type: rbac
    superUsers:
      - User:kafka
      - User:kraftcontroller
  dependencies:
    mdsKafkaCluster:
      bootstrapEndpoint: kafka.confluent.svc.cluster.local:9071
      authentication:
        type: mtls
        sslClientAuthentication: true
      tls:
        enabled: true
    metricsClient:
      url: https://controlcenter.confluent.svc.cluster.local:9090
      authentication:
        type: mtls
      tls:
        enabled: true
        secretRef: prometheus-client-tls
  podTemplate:
    resources:
      requests: { cpu: 250m, memory: 1Gi }
      limits: { memory: 2Gi }
---
apiVersion: platform.confluent.io/v1beta1
kind: Kafka
metadata:
  name: kafka
  namespace: confluent
spec:
  replicas: 3
  oneReplicaPerNode: true
  rackAssignment:
    nodeLabels:
      - topology.kubernetes.io/zone
  image:
    application: confluentinc/cp-server:8.4.1
    init: confluentinc/confluent-init-container:3.4.0
  dataVolumeCapacity: 100Gi
  tls:
    secretRef: tls-kafka
  podTemplate:
    serviceAccountName: kafka
    resources:
      requests: { cpu: "1", memory: 4Gi }
      limits: { memory: 6Gi }
  listeners:
    internal:
      authentication:
        type: mtls
        principalMappingRules:
          - "RULE:.*CN=([a-zA-Z0-9.-]*).*$/$1/"
          - "DEFAULT"
      tls:
        enabled: true
    external:
      authentication:
        type: mtls
        principalMappingRules:
          - "RULE:.*CN=([a-zA-Z0-9.-]*).*$/$1/"
          - "DEFAULT"
      tls:
        enabled: true
      externalAccess:
        type: loadBalancer
        loadBalancer:
          domain: ${PRIVATE_ZONE}
          bootstrapPrefix: kafka
          brokerPrefix: b
          annotations:
            service.beta.kubernetes.io/aws-load-balancer-scheme: internal
            service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
            service.beta.kubernetes.io/aws-load-balancer-attributes: load_balancing.cross_zone.enabled=true
          loadBalancerSourceRanges:
            - ${CORE_VPC_CIDR}   # core VPC
            - ${DMZ_VPC_CIDR}   # DMZ VPC (CPC Gateway)
  authorization:
    type: rbac
    superUsers:
      - User:kafka
      - User:kraftcontroller
  services:
    mds:
      # mTLS callers of the embedded REST API get an impersonation token; SR needs it with >1 replica.
      impersonation:
        admins:
          - User:kafka
          - User:krp
          - User:sr
          - User:sr-ro    # read-only SR leader (cfk/core/06-schema-linking)
          - User:sr-dmz   # read-only SR followers (cfk/dmz/02-schema-registry)
      tls:
        enabled: true
      tokenKeyPair:
        secretRef: mds-token
      provider:
        ldap:
          address: ldaps://ldap.confluent.svc.cluster.local:636
          authentication:
            type: simple
            simple:
              secretRef: mds-ldap-bind
          tls:
            enabled: true
          configurations:
            userSearchBase: ou=users,dc=wf,dc=demo
            userSearchScope: 1
            userObjectClass: inetOrgPerson
            userNameAttribute: cn
            groupSearchBase: ou=groups,dc=wf,dc=demo
            groupSearchScope: 1
            groupObjectClass: groupOfNames
            groupNameAttribute: cn
            groupMemberAttribute: member
            groupMemberAttributePattern: cn=(.*),ou=users,dc=wf,dc=demo
        mtls:
          sslClientAuthentication: requested
          principalMappingRules:
            - "RULE:.*CN=([a-zA-Z0-9.-]*).*$/$1/"
            - "DEFAULT"
  dependencies:
    kafkaRest:
      authentication:
        type: mtls
        sslClientAuthentication: true
      tls:
        enabled: true
        secretRef: tls-kafka
    kRaftController:
      controllerListener:
        authentication:
          type: mtls
        tls:
          enabled: true
      clusterRef:
        name: kraftcontroller
    metricsClient:
      url: https://controlcenter.confluent.svc.cluster.local:9090
      authentication:
        type: mtls
      tls:
        enabled: true
        secretRef: prometheus-client-tls
  configOverrides:
    server:
      - default.replication.factor=3
      - min.insync.replicas=2
      - auto.create.topics.enable=false
      # Audit logs: allowed events -> _success, denied events -> _failure.
      # Allowed produce/consume is logged for demo-* topics only; allowed describe/group events are
      # not logged (one per metadata request / heartbeat).
      - 'confluent.security.event.router.config={"routes":{"crn:///kafka=*/topic=demo-*":{"produce":{"allowed":"confluent-audit-log-events_success","denied":"confluent-audit-log-events_failure"},"consume":{"allowed":"confluent-audit-log-events_success","denied":"confluent-audit-log-events_failure"},"describe":{"denied":"confluent-audit-log-events_failure"}},"crn:///kafka=*/topic=*":{"produce":{"denied":"confluent-audit-log-events_failure"},"consume":{"denied":"confluent-audit-log-events_failure"},"describe":{"denied":"confluent-audit-log-events_failure"}},"crn:///kafka=*/group=*":{"consume":{"denied":"confluent-audit-log-events_failure"},"describe":{"denied":"confluent-audit-log-events_failure"}}},"default_topics":{"allowed":"confluent-audit-log-events_success","denied":"confluent-audit-log-events_failure"},"excluded_principals":["User:kafka","User:kraftcontroller"],"destinations":{"topics":{"confluent-audit-log-events_success":{"retention_ms":7776000000},"confluent-audit-log-events_failure":{"retention_ms":7776000000}}}}'
---
apiVersion: platform.confluent.io/v1beta1
kind: KafkaRestClass
metadata:
  name: default
  namespace: confluent
spec:
  kafkaClusterRef:
    name: kafka
  kafkaRest:
    endpoint: https://kafka.confluent.svc.cluster.local:8090
    authentication:
      type: mtls
      sslClientAuthentication: true
    tls:
      secretRef: tls-kafka
