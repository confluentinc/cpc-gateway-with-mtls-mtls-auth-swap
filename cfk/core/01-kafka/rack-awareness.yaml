# Lets the Kafka pods read their node's topology.kubernetes.io/zone label to set broker.rack.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kafka
  namespace: confluent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: confluent-kafka-rack
rules:
  - apiGroups: [""]
    resources: [nodes, pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: confluent-kafka-rack
subjects:
  - kind: ServiceAccount
    name: kafka
    namespace: confluent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: confluent-kafka-rack
