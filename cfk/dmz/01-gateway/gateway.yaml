# CPC Gateway in the DMZ: mTLS -> mTLS with host-based (SNI) routing, following the internal
# "mTLS to mTLS (SNI routing)" pattern. Clients present a certificate from the WF demo CA to the Gateway; the Gateway
# ends that TLS session and opens its own mTLS session to the core brokers as CN=cpcgw-dmz-client (auth: passthrough,
# no SASL). Clients only ever see ${GATEWAY_DOMAIN} / b<N>.${GATEWAY_DOMAIN}.
apiVersion: platform.confluent.io/v1beta1
kind: Gateway
metadata:
  name: cpcgw-dmz
  namespace: gateway
spec:
  replicas: 3
  # No oneReplicaPerNode: with 3 replicas on 3 nodes the rolling update can never place its surge pod.
  # The zone spread below still keeps one Gateway per AZ.
  image:
    application: confluentinc/cpc-gateway:1.4.0
    init: confluentinc/confluent-init-container:3.4.0
  podTemplate:
    # IRSA service account from kms-irsa.yaml (AWS credentials for the encryption rule executors).
    serviceAccountName: cpcgw-dmz
    resources:
      requests: { cpu: 500m, memory: 1Gi }
      limits: { memory: 2Gi }
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: DoNotSchedule
        # Count only the current ReplicaSet so pods from the outgoing revision don't skew placement during a rollout.
        matchLabelKeys:
          - pod-template-hash
        labelSelector:
          matchLabels:
            app: cpcgw-dmz
  streamingDomains:
    - name: core
      type: kafka
      kafkaCluster:
        # Core external listener: internal bootstrap NLB, advertises b0/b1/b2.${PRIVATE_ZONE}:9092.
        bootstrapServers:
          - id: core-mtls
            endpoint: kafka.${PRIVATE_ZONE}:9092
            tls:
              secretRef: cpcgw-dmz-client-tls
        nodeIdRanges:
          - name: brokers
            start: 0
            end: 2
  routes:
    - name: sni-route-core
      endpoint: ${GATEWAY_DOMAIN}:9092
      brokerIdentificationStrategy:
        type: host
        pattern: b$(nodeId).${GATEWAY_DOMAIN}:9092
      streamingDomain:
        name: core
        bootstrapServerId: core-mtls
      security:
        client:
          tls:
            secretRef: cpcgw-dmz-server-tls
      # Route fencing demo: the Gateway refuses produce requests to demo-fenced; every other topic is unaffected.
      rules:
        fencing:
          - blocked: true
            topics: [demo-fenced]
            trafficType: PRODUCE
  # Required. Without them CFK renders no clientAuth and the Gateway accepts clients that present no certificate.
  # The CRD alternative (security.client.authentication.type: mtls) is not usable with CFK 3.4.0 / Gateway 1.4.0:
  # CFK renders its principalMappingRules empty and the Gateway refuses to start ("principalMappingRules cannot be
  # null or empty").
  configOverrides:
    server:
      routes.sni-route-core.security.auth: passthrough
      routes.sni-route-core.security.ssl.clientAuth: required
  policies:
    dataGovernance:
      schemaRegistry:
        urls:
          - https://sr.${PRIVATE_ZONE}
        authentication:
          type: basic
          basic:
            secretRef: cpcgw-dmz-sr-credentials
        tls:
          enabled: true
          secretRef: cpcgw-dmz-ca
        # Run the ENCRYPT / ENCRYPT_PAYLOAD rules of schemas with enableAt: GATEWAY. KEKs are aws-kms keys; the
        # executors assume the role.arn in aws-kms-role-params on top of the pod's IRSA credentials.
        ruleExecutors:
          - name: encryptField
            class: io.confluent.kafka.schemaregistry.encryption.FieldEncryptionExecutor
            secretRef: aws-kms-role-params
          - name: encryptPayload
            class: io.confluent.kafka.schemaregistry.encryption.EncryptionExecutor
            secretRef: aws-kms-role-params
      key:
        enabled: false
      value:
        enabled: true
        subjectNameStrategy: TOPIC
      topics:
        # demo-orders carries plain-text test records; schema validation applies to the other topics (demo-payments).
        - name: demo-orders
          value:
            enabled: false
        - name: demo-fenced
          value:
            enabled: false
  externalAccess:
    type: loadBalancer
    loadBalancer:
      domain: ${PUBLIC_ZONE}
      prefix: kafka.gateway
      port: 9092
      annotations:
        service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
        service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
        service.beta.kubernetes.io/aws-load-balancer-attributes: load_balancing.cross_zone.enabled=true
        # CFK also publishes 9190 (admin) and 9180 (/config) on this Service; this Terraform-managed group
        # (terraform/dmz output gateway_nlb_security_group_id) only admits 9092 from the allowlist.
        service.beta.kubernetes.io/aws-load-balancer-security-groups: ${GATEWAY_NLB_SG}
        service.beta.kubernetes.io/aws-load-balancer-manage-backend-security-group-rules: "true"
        external-dns.alpha.kubernetes.io/hostname: ${GATEWAY_DOMAIN},*.${GATEWAY_DOMAIN}
      loadBalancerSourceRanges: ${PUBLIC_ALLOWED_CIDRS_YAML}
